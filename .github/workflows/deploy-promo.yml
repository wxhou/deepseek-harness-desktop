# 宣传页 → GitHub Pages 部署
# 仅当 promotional/ 下的文件变更时触发；构建产物为纯静态站点
name: deploy-promo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'promotional/**'
      - '.github/workflows/deploy-promo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# 避免并发部署互相抢占 Pages 环境
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -C promotional build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: promotional/dist

      - id: deployment
        uses: actions/deploy-pages@v4