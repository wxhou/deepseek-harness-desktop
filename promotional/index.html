<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 让移动端浏览器状态栏/地址栏跟随深色主题 -->
    <meta name="theme-color" content="#05070b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness Desktop｜DeepSeek Harness 桌面客户端</title>
    <meta
      name="description"
      content="在桌面上一键运行 DeepSeek Harness —— 无需 Node.js、无需 pnpm、无需 Docker，下载即用。社区独立维护的开源桌面客户端，兼容 Harness 插件生态。"
    />
    <!-- 社交分享卡片（Telegram/QQ/Discord/WhatsApp/iMessage/飞书等）。
         og:image 必须是绝对 URL——OG 规范不解析相对路径，且 vite base:'./'
         构建会把 / 开头的路径重写成 ./ 相对路径（绝对 https URL 不受影响），
         所以这里直接写完整域名。微信聊天窗口的卡片需微信认证域名接入
         JS-SDK，OG 无法覆盖（见 README 部署说明）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeepSeek Harness Desktop" />
    <meta property="og:url" content="https://dshdesktop.pages.dev/" />
    <meta property="og:title" content="DeepSeek Harness Desktop" />
    <meta
      property="og:description"
      content="在桌面上一键运行 DeepSeek Harness —— 无需 Node.js、无需 pnpm、无需 Docker，下载即用。"
    />
    <meta property="og:image" content="https://dshdesktop.pages.dev/images/app-preview.png" />
    <meta property="og:image:width" content="1279" />
    <meta property="og:image:height" content="749" />
    <meta property="og:image:alt" content="DeepSeek Harness Desktop 应用界面" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DeepSeek Harness Desktop" />
    <meta
      name="twitter:description"
      content="在桌面上一键运行 DeepSeek Harness —— 无需 Node.js、无需 pnpm、无需 Docker，下载即用。"
    />
    <meta name="twitter:image" content="https://dshdesktop.pages.dev/images/app-preview.png" />
    <!-- QQ 聊天窗口的链接卡片不读 Open Graph，读 schema.org Microdata 的
         itemprop 三件套（name/description/image）；缺了这三行 QQ 只显示纯链接
         （微信聊天窗口则仍需认证域名接 JS-SDK，见上方说明）。 -->
    <meta itemprop="name" content="DeepSeek Harness Desktop" />
    <meta
      itemprop="description"
      content="在桌面上一键运行 DeepSeek Harness —— 无需 Node.js、无需 pnpm、无需 Docker，下载即用。"
    />
    <meta itemprop="image" content="https://dshdesktop.pages.dev/images/app-preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
